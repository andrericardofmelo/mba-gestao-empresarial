<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Disciplinas — MBA</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: #f1f5f9;
      color: #334155;
    }
    .mba-container {
      max-width: 1200px;
      margin: 0 auto;
      background: #f8fafc;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .mba-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 14px;
    }
    .mba-title {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mba-filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .mba-filters select, .mba-filters input {
      padding: 9px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 13.5px;
      background: white;
      color: #334155;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mba-filters select:hover, .mba-filters input:hover {
      border-color: #94a3b8;
    }
    .mba-filters select:focus, .mba-filters input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.12);
    }
    .mba-table-wrap {
      overflow-x: auto;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      background: white;
      border: 1px solid #e2e8f0;
    }
    .mba-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .mba-table thead {
      background: #0f172a;
      color: white;
      position: sticky;
      top: 0;
    }
    .mba-table th {
      padding: 14px 16px;
      text-align: left;
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }
    .mba-table th.center { text-align: center; }
    .mba-table td {
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
      color: #334155;
      vertical-align: middle;
    }
    .mba-table tr:nth-child(even) { background: #f8fafc; }
    .mba-table tr:hover { background: #e0f2fe; transition: background 0.15s; }
    .mba-table td.center { text-align: center; }
    .status-select {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 12.5px;
      cursor: pointer;
      min-width: 120px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .status-pendente { background: #fef3c7; color: #92400e; border-color: #f59e0b; }
    .status-andamento { background: #dbeafe; color: #1e40af; border-color: #3b82f6; }
    .status-aprovado { background: #d1fae5; color: #065f46; border-color: #10b981; }
    .status-reprovado { background: #fee2e2; color: #991b1b; border-color: #ef4444; }
    .nota-input {
      width: 65px;
      padding: 6px 10px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      text-align: center;
      font-size: 13.5px;
      font-weight: 600;
      color: #0f172a;
      transition: all 0.2s;
    }
    .nota-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }
    .badge-ano {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 700;
    }
    .ano-2025 { background: #ede9fe; color: #5b21b6; }
    .ano-2026 { background: #cffafe; color: #0e7490; }
    .badge-mes {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11.5px;
      font-weight: 600;
      background: #f1f5f9;
      color: #475569;
      border: 1px solid #e2e8f0;
    }
    .mba-summary {
      margin-top: 20px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }
    .summary-card {
      background: white;
      padding: 14px 20px;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      min-width: 130px;
      border: 1px solid #e2e8f0;
      flex: 1;
    }
    .summary-label {
      font-size: 11px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 5px;
      font-weight: 600;
    }
    .summary-value {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
    }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
      font-size: 15px;
    }
    @media (max-width: 768px) {
      .mba-header { flex-direction: column; align-items: flex-start; }
      .mba-filters { width: 100%; }
      .mba-filters select, .mba-filters input { flex: 1; min-width: 120px; }
      .mba-table th, .mba-table td { padding: 10px 12px; font-size: 12.5px; }
      .status-select { min-width: 100px; }
    }
  </style>
</head>
<body>
  <div class="mba-container">
    <div class="mba-header">
      <h2 class="mba-title">📚 Controle de Disciplinas — MBA</h2>
      <div class="mba-filters">
        <select id="filterAno">
          <option value="">Todos os Anos</option>
          <option value="2025">2025</option>
          <option value="2026">2026</option>
        </select>
        <select id="filterMes">
          <option value="">Todos os Meses</option>
          <option value="01">Janeiro</option>
          <option value="02">Fevereiro</option>
          <option value="03">Março</option>
          <option value="04">Abril</option>
          <option value="05">Maio</option>
          <option value="06">Junho</option>
          <option value="07">Julho</option> 
          <option value="08">Agosto</option>
          <option value="09">Setembro</option> 
          <option value="10">Outubro</option> 
          <option value="11">Novembro</option> 
          <option value="12">Dezembro</option>
        </select>
        <select id="filterStatus">
          <option value="">Todos os Status</option>
          <option value="Pendente">Pendente</option>
          <option value="Em Andamento">Em Andamento</option>
          <option value="Aprovado">Aprovado</option>
          <option value="Reprovado">Reprovado</option>
        </select>
        <input type="text" id="searchNome" placeholder="🔍 Buscar disciplina..." style="min-width:190px;">
      </div>
    </div>

    <div class="mba-table-wrap">
      <table class="mba-table" id="tabelaDisciplinas">
        <thead>
          <tr>
            <th>Disciplina</th>
            <th class="center">Mês</th>
            <th class="center">Ano</th>
            <th class="center">Data Limite</th>
            <th class="center">Status</th>
            <th class="center">Nota</th>
          </tr>
        </thead>
        <tbody id="corpoTabela"></tbody>
      </table>
    </div>

    <div class="mba-summary">
      <div class="summary-card">
        <div class="summary-label">Total</div>
        <div class="summary-value" id="totalDisc">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Concluídas</div>
        <div class="summary-value" id="totalConc" style="color:#059669;">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Em Andamento</div>
        <div class="summary-value" id="totalAnda" style="color:#2563eb;">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Pendentes</div>
        <div class="summary-value" id="totalPend" style="color:#d97706;">0</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Média</div>
        <div class="summary-value" id="mediaNotas" style="color:#7c3aed;">—</div>
      </div>
    </div>
  </div>

  <script>
    const disciplinas = [
      { nome: "Liderança e Gestão de Equipes", mes: "09", ano: "2026", dataLimite: "13/09/2026", status: "Pendente", nota: "" },
      { nome: "Finanças Corporativas", mes: "09", ano: "2026", dataLimite: "13/09/2026", status: "Pendente", nota: "" },      
      { nome: "Gestão de Serviços", mes: "08", ano: "2026", dataLimite: "02/08/2026", status: "Em Andamento", nota: "" },
      { nome: "Environmental Social and Corporate Governance", mes: "08", ano: "2026", dataLimite: "02/08/2026", status: "Aprovado", nota: "10" },     
      { nome: "Negociação e Administração de Conflitos", mes: "05", ano: "2026", dataLimite: "01/05/2026", status: "Aprovado", nota: "10" },
      { nome: "Análise das Demonstrações Contábeis", mes: "05", ano: "2026", dataLimite: "05/2026", status: "Aprovado", nota: "10" },
      { nome: "Estratégias de Marketing", mes: "03", ano: "2026", dataLimite: "01/03/2026", status: "Aprovado", nota: "9.8" },
      { nome: "Gestão de Projetos", mes: "03", ano: "2026", dataLimite: "01/03/2026", status: "Aprovado", nota: "9.4" },
      { nome: "Empreendedorismo e Gestão da Inovação", mes: "02", ano: "2026", dataLimite: "01/02/2026", status: "Aprovado", nota: "10" },
      { nome: "Estratégia Corporativa e de Negócios", mes: "02", ano: "2026", dataLimite: "01/02/2026", status: "Aprovado", nota: "8.5" },
      { nome: "Fundamentos da Inteligência Artificial", mes: "06", ano: "2025", dataLimite: "01/06/2025", status: "Aprovado", nota: "10" },
      { nome: "ARGo – Alternate Reality Goal", mes: "12", ano: "2025", dataLimite: "01/12/2025", status: "Aprovado", nota: "9" }
    ];

    const meses = { "01": "Jan", "02": "Fev", "03": "Mar", "04": "Abr", "05": "Mai", "06": "Jun","07": "Jul", "08": "Ago", "09": "Set", "10": "Out", "11": "Nov", "12": "Dez" };

    function getStatusClass(status) {
      switch(status) {
        case "Pendente": return "status-pendente";
        case "Em Andamento": return "status-andamento";
        case "Aprovado": return "status-aprovado";
        case "Reprovado": return "status-reprovado";
        default: return "";
      }
    }

    function renderTabela() {
      const filtroAno = document.getElementById("filterAno").value;
      const filtroMes = document.getElementById("filterMes").value;
      const filtroStatus = document.getElementById("filterStatus").value;
      const busca = document.getElementById("searchNome").value.toLowerCase();

      const tbody = document.getElementById("corpoTabela");
      tbody.innerHTML = "";

      let count = 0, aprovados = 0, andamento = 0, pendentes = 0, somaNotas = 0, countNotas = 0;

      disciplinas.forEach((d, i) => {
        if (filtroAno && d.ano !== filtroAno) return;
        if (filtroMes && d.mes !== filtroMes) return;
        if (filtroStatus && d.status !== filtroStatus) return;
        if (busca && !d.nome.toLowerCase().includes(busca)) return;

        count++;
        if (d.status === "Aprovado") aprovados++;
        if (d.status === "Em Andamento") andamento++;
        if (d.status === "Pendente") pendentes++;
        if (d.nota && !isNaN(parseFloat(d.nota))) { somaNotas += parseFloat(d.nota); countNotas++; }

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${d.nome}</td>
          <td class="center"><span class="badge-mes">${meses[d.mes] || d.mes}</span></td>
          <td class="center"><span class="badge-ano ano-${d.ano}">${d.ano}</span></td>
          <td class="center">${d.dataLimite}</td>
          <td class="center">
            <select class="status-select ${getStatusClass(d.status)}" onchange="atualizaStatus(${i}, this)">
              <option value="Pendente" ${d.status==="Pendente"?"selected":""}>Pendente</option>
              <option value="Em Andamento" ${d.status==="Em Andamento"?"selected":""}>Em Andamento</option>
              <option value="Aprovado" ${d.status==="Aprovado"?"selected":""}>Aprovado</option>
              <option value="Reprovado" ${d.status==="Reprovado"?"selected":""}>Reprovado</option>
            </select>
          </td>
          <td class="center"><input type="text" class="nota-input" value="${d.nota}" placeholder="—" onchange="atualizaNota(${i}, this.value)" onblur="atualizaNota(${i}, this.value)"></td>
        `;
        tbody.appendChild(tr);
      });

      if (count === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state">Nenhuma disciplina encontrada com os filtros selecionados.</td></tr>`;
      }

      document.getElementById("totalDisc").textContent = count;
      document.getElementById("totalConc").textContent = aprovados;
      document.getElementById("totalAnda").textContent = andamento;
      document.getElementById("totalPend").textContent = pendentes;
      document.getElementById("mediaNotas").textContent = countNotas > 0 ? (somaNotas / countNotas).toFixed(1).replace(".", ",") : "—";
    }

    function atualizaStatus(idx, el) {
      disciplinas[idx].status = el.value;
      el.className = "status-select " + getStatusClass(el.value);
      renderTabela();
    }

    function atualizaNota(idx, val) {
      const n = parseFloat(val.replace(",", "."));
      disciplinas[idx].nota = (!isNaN(n) && n >= 0 && n <= 10) ? n.toFixed(1).replace(".", ",") : "";
      renderTabela();
    }

    document.getElementById("filterAno").addEventListener("change", renderTabela);
    document.getElementById("filterMes").addEventListener("change", renderTabela);
    document.getElementById("filterStatus").addEventListener("change", renderTabela);
    document.getElementById("searchNome").addEventListener("input", renderTabela);

    renderTabela();
  </script>
</body>
</html>
